<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doorgifte richting iframe-pagina</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="shell">
      <span class="shell-mark" aria-hidden="true">
        <svg viewBox="0 0 16 16" width="16" height="16">
          <path fill="currentColor" d="M8 1.5 2 6.2V14h4.2V9.4h3.6V14H14V6.2L8 1.5z" />
        </svg>
      </span>
      <span class="shell-product">Service Cloud</span>
      <span class="shell-divider" aria-hidden="true"></span>
      <span class="shell-context">Parameterdoorgifte</span>
    </header>

    <main class="page">
      <section class="object">
        <div class="object-title">
          <p class="eyebrow">Statische website</p>
          <h1>Parameterdoorgifte</h1>
          <p class="lead">
            Deze pagina krijgt 3 inkomende parameters vanuit SSCV2 en toont ze hieronder.
            <a id="example-link" href="?naam=Lot&amp;afdeling=Balie&amp;referentie=EILAB01">dit voorbeeld</a>.
          </p>
        </div>

        <section class="facets" aria-label="Ontvangen parameters">
          <article class="facet" data-key="naam">
            <h2>Naam</h2>
            <p class="value" data-value="naam">—</p>
          </article>
          <article class="facet" data-key="afdeling">
            <h2>Afdeling</h2>
            <p class="value" data-value="afdeling">—</p>
          </article>
          <article class="facet" data-key="referentie">
            <h2>Referentie</h2>
            <p class="value" data-value="referentie">—</p>
          </article>
        </section>
      </section>

      <section class="panel">
        <h2 class="panel-title">Parameters</h2>
        <form class="composer" id="composer">
          <label>
            Naam
            <input name="naam" type="text" autocomplete="off" placeholder="Lot" />
          </label>
          <label>
            Afdeling
            <input name="afdeling" type="text" autocomplete="off" placeholder="Balie" />
          </label>
          <label>
            Referentie
            <input name="referentie" type="text" autocomplete="off" placeholder="EILAB01" />
          </label>
        <label>
          Update e-mail adres
          <input name="email" type="email" autocomplete="off" placeholder="user@example.com" />
        </label>
        <div class="button-group">
          <button type="submit" name="action" value="save">Opslaan</button>
          <button type="button" id="cancel-btn">Annuleren</button>
        </div>
        </form>

        <div class="url">
          <span>Huidige aanroep</span>
          <code id="current-url"></code>
        </div>
      </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
